<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap of Faith - Controller Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Titan+One&display=swap" rel="stylesheet">
    
    <style>
        /* Custom Font Assignments */
        .font-chunky { font-family: 'Titan One', cursive; }
        .font-nunito { font-family: 'Nunito', sans-serif; }

        /* Floating Animation for the background elements */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .floater { animation: float 6s ease-in-out infinite; }
        
        /* Card Tilt Effect */
        .game-card {
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .game-card:hover {
            transform: rotate(0deg) scale(1.02) !important;
        }
    </style>
</head>
<!-- Background: Misty Teal/Cyan gradient -->
<body class="bg-gradient-to-b from-[#4FD1C5] via-[#81E6D9] to-[#CCFBF1] min-h-screen flex items-center justify-center p-4 font-nunito overflow-hidden relative">

    <!-- Atmospheric Background Elements -->
    <div class="absolute bottom-0 left-0 w-full h-1/3 bg-gradient-to-t from-[#2C7A7B] to-transparent opacity-20 pointer-events-none"></div>
    
    <!-- Floating "Island" shapes in background -->
    <div class="absolute top-20 left-10 w-32 h-32 bg-[#38B2AC] rounded-full mix-blend-multiply filter blur-2xl opacity-40 animate-pulse"></div>
    <div class="absolute bottom-20 right-10 w-48 h-48 bg-[#319795] rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>

    <!-- Main Instruction Card -->
    <!-- The rotation (-1deg) adds that playful, non-rigid game feel -->
    <main class="game-card relative bg-white w-full max-w-md rounded-[2rem] shadow-[0_12px_0_rgba(0,0,0,0.15)] border-4 border-white transform -rotate-1 z-10 pb-2">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-[#FFC107] to-[#FF9800] rounded-t-[1.7rem] p-6 text-center relative overflow-hidden">
            <!-- Subtle pattern overlay -->
            <div class="absolute inset-0 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgdmlld0JveD0iMCAwIDIwIDIwIiBmaWxsPSIjMDAwMDAwIj48Y2lyY2xlIGN4PSIyIiBjeT0iMiIgcj0iMiIvPjwvc3ZnPg==')]"></div>
            
            <h1 class="font-chunky text-3xl md:text-4xl text-white drop-shadow-md tracking-wide relative z-10 uppercase">
                No Controller?
            </h1>
            <p class="font-nunito font-black text-white/90 text-lg uppercase tracking-wider mt-1 relative z-10">Use your phone!</p>
        </div>

        <!-- Content Section -->
        <div class="p-8 space-y-8">
            
            <!-- Step 1: Wifi -->
            <div class="flex gap-4 items-start">
                <div class="flex-shrink-0 w-12 h-12 bg-[#E1F5FE] rounded-2xl flex items-center justify-center shadow-sm">
                    <!-- Wifi Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-[#039BE5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
                    </svg>
                </div>
                <div>
                    <p class="text-gray-800 font-bold text-lg leading-tight">
                        Check that your phone and PC are on the <span class="text-[#039BE5]">same Wi-Fi</span>.
                    </p>
                    <p class="text-gray-400 font-semibold text-sm mt-1 bg-gray-50 inline-block px-2 py-1 rounded-md border border-gray-100">
                        (This is usually where it fails)
                    </p>
                </div>
            </div>

            <!-- Step 2: The Action -->
            <div class="flex gap-4 items-center">
                <div class="flex-shrink-0 w-12 h-12 bg-[#E8F5E9] rounded-2xl flex items-center justify-center shadow-sm">
                    <!-- Touch Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-[#43A047]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
                    </svg>
                </div>
                <div class="flex-1">
                    <p class="text-gray-800 font-bold text-lg mb-2">Tap:</p>
                    <!-- Visual representation of the button they need to find -->
                    <div class="bg-[#4CAF50] text-white font-chunky text-2xl py-3 px-6 rounded-xl shadow-[0_4px_0_#2E7D32] text-center transform active:translate-y-1 active:shadow-none transition-all cursor-default select-none tracking-wide">
                        JOIN GAME
                    </div>
                </div>
            </div>

            <!-- Step 3: Success -->
            <div class="flex gap-4 items-center pt-2 border-t-2 border-dashed border-gray-100">
                <div class="flex-shrink-0 w-12 h-12 bg-[#FFF8E1] rounded-2xl flex items-center justify-center shadow-sm">
                    <!-- Check/Rocket Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-[#FFB300]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                </div>
                <p class="text-gray-800 font-bold text-xl">
                    You're in.
                </p>
            </div>

        </div>
    </main>

    <!-- Decorative Hills (Covering bottom of screen) -->
    <!-- Back Hill (Darker) -->
    <div class="fixed -bottom-20 -left-[20%] w-[150%] h-80 bg-[#388E3C] rounded-[100%] z-0 pointer-events-none shadow-lg"></div>
    <!-- Front Hill (Lighter) -->
    <div class="fixed -bottom-32 -right-[20%] w-[150%] h-80 bg-[#4CAF50] rounded-[100%] z-0 pointer-events-none shadow-lg"></div>

</body>
</html>
